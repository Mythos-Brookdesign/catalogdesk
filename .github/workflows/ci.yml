name: CatalogDesk CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop --project=mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7

  desktop:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e -- --project=electron
      - run: npm run dist:dir
      - uses: actions/upload-artifact@v4
        with:
          name: catalogdesk-macos-unsigned
          path: release/mac*/CatalogDesk.app
          retention-days: 7
